name: News discovery
on:
  schedule:
    - cron: '23 13 * * 1,3,5'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: news-discovery
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python3 scripts/collect-news.py
      - name: Retain the queue, including partial results on feed failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: news-review-queue
          path: |
            editorial/queue.json
            editorial/queue.md
          retention-days: 30
      - name: Add review instructions to the run
        if: always()
        run: |
          echo 'Download news-review-queue. Follow editorial/README.md to read sources, prepare a draft, and open a reviewed content PR. This workflow cannot publish or write to the repository.' >> "$GITHUB_STEP_SUMMARY"
