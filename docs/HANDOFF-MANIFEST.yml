invariants:
  - New public property code is portable static HTML, CSS, SVG, and minimal browser JavaScript.
  - No new Vite code or proprietary backend runtime is permitted.
  - Each property keeps original content and a self-referencing canonical URL only.
  - Cross-property links must disclose reader benefit and relationship.
  - Do not add deceptive engagement patterns, fabricated social proof, unsupported claims, or unapproved external changes.
  - Treat autonomy as bounded delegation with decision rights, trace records, observability, and accountable human escalation.
